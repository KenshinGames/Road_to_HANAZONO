<style>
/* Road to HANAZONO v0.2.1 — 横画面・固定レイアウト（ページをスクロールさせない） */
:root {
  --bg: #f4f7f2; --card: #ffffff; --ink: #1c241c; --sub: #5d6b5d; --line: #dde5da;
  --brand: #166534; --brand-ink: #ffffff; --brand-soft: #e5f2e7;
  --ok: #15803d; --ng: #c62f3b; --warn-soft: #fdf3d8; --shadow: 0 1px 3px rgba(20, 40, 20, .08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101410; --card: #1b211b; --ink: #e8eee8; --sub: #9fb09f; --line: #2c362c;
    --brand: #4ade80; --brand-ink: #0c1a0f; --brand-soft: #14301d;
    --ok: #4ade80; --ng: #ff8a8a; --warn-soft: #38300f; --shadow: 0 1px 3px rgba(0, 0, 0, .4);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { touch-action: manipulation; height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
  font-size: 16px; line-height: 1.5;
}
#app { max-width: 1060px; margin: 0 auto; padding: 12px 14px 40px; }
.stack > * + * { margin-top: 12px; }
.hud {
  display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center;
  background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px 14px; box-shadow: var(--shadow);
}
.hud .ttl { font-weight: 800; font-size: 17px; }
.hud .item b { font-variant-numeric: tabular-nums; }
.hud .sp { flex: 1; }
.hero { text-align: center; padding: 10px 6px 2px; }
.hero h1 { font-size: 23px; margin: 0 0 4px; }
.hero p { margin: 0; color: var(--sub); font-size: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; box-shadow: var(--shadow); }
.sec { font-weight: 700; margin: 2px 2px 8px; font-size: 15px; }
.rowline { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.big { font-size: 20px; font-weight: 800; }
.sub { color: var(--sub); font-size: 13px; }
.btn {
  display: block; width: 100%; padding: 13px; border: 1px solid var(--line); border-radius: 14px;
  background: var(--card); color: var(--ink); font-size: 16px; font-weight: 700; cursor: pointer;
  transition: transform .08s ease, background .15s ease;
}
.btn:active { transform: scale(.99); }
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: transparent; }
.btn.small { padding: 9px; font-size: 14px; }
.choices > * + * { margin-top: 8px; }
.choice { text-align: left; }
.choice .t { font-weight: 700; }
.choice .d { color: var(--sub); font-size: 13px; font-weight: 400; }
select {
  width: 100%; padding: 10px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--card); color: var(--ink); font-size: 15px;
}
label.lab { display: block; font-size: 13px; color: var(--sub); margin: 8px 0 3px; }
table.squad { width: 100%; border-collapse: collapse; font-size: 13px; }
table.squad th, table.squad td { padding: 5px 3px; border-bottom: 1px solid var(--line); text-align: center; font-variant-numeric: tabular-nums; }
table.squad th { color: var(--sub); font-weight: 600; font-size: 11px; }
table.squad td.name { text-align: left; font-weight: 700; white-space: nowrap; }
.score { display: flex; justify-content: space-between; align-items: center; text-align: center; }
.score .team { flex: 1; }
.score .pts { font-size: 32px; font-weight: 800; font-variant-numeric: tabular-nums; }
.score .vs { color: var(--sub); font-size: 13px; }
.log { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; font-size: 14px; overflow-y: auto; }
.log > * + * { margin-top: 6px; }
.log .hl { background: var(--warn-soft); border-radius: 8px; padding: 6px 8px; }
.log .score-line { font-weight: 700; }
.center { text-align: center; }
.banner { border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); border: 1px solid var(--line); line-height: 0; }
.banner svg { width: 100%; height: 100%; display: block; }
.portrait-note { display: none; }
/* すごろく盤面 */
.board { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.cell {
  border-radius: 12px; border: 1px solid var(--line); background: var(--card);
  min-height: 62px; padding: 6px 4px; text-align: center; font-size: 12px;
  display: flex; flex-direction: column; justify-content: center; gap: 2px;
}
.cell .ic { font-size: 19px; line-height: 1; }
.cell.done { opacity: .38; }
.cell.now { outline: 3px solid var(--brand); outline-offset: -1px; font-weight: 700; }
.cell.c-prac { background: #e9f7ec; } .cell.c-big { background: #cdeeda; }
.cell.c-ev { background: #fdeeda; } .cell.c-rec { background: #e3eefc; }
.cell.c-free { background: #f0f0ea; } .cell.c-meet { background: #f1e8fb; }
.cell.c-end { background: #fde8e8; }
@media (prefers-color-scheme: dark) {
  .cell.c-prac { background: #17301d; } .cell.c-big { background: #1d4530; }
  .cell.c-ev { background: #3a2c12; } .cell.c-rec { background: #16283f; }
  .cell.c-free { background: #24261f; } .cell.c-meet { background: #2a1f3d; }
  .cell.c-end { background: #3a1d1d; }
}
.hand { display: flex; gap: 8px; }
.pcard {
  flex: 1; padding: 10px 6px; border-radius: 14px; border: 1px solid var(--line);
  background: var(--brand-soft); color: var(--ink); cursor: pointer; text-align: center;
}
.pcard .num { font-size: 25px; font-weight: 800; color: var(--brand); display: block; line-height: 1.15; }
.pcard .cap { font-size: 12px; color: var(--sub); }
.pcard:active { transform: scale(.98); }
.meter { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.meter > div { height: 100%; background: var(--brand); }
/* v0.3: 要因分解バー・特能タグ・選手詳細 */
.frow { display: flex; align-items: center; gap: 8px; margin-top: 7px; font-size: 13px; }
.frow .flab { flex: 0 0 46%; color: var(--sub); word-break: keep-all; }
.nowrap { white-space: nowrap; }
.frow .fmeter { flex: 1; }
.frow .fval { flex: 0 0 38px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
.tags { text-align: right; }
.tag { display: inline-block; padding: 1px 8px; margin: 1px 0 1px 4px; border-radius: 99px; background: var(--brand-soft); color: var(--brand); font-size: 12px; font-weight: 700; }
table.squad tr.prow { cursor: pointer; }
table.squad tr.prow.sel td { background: var(--brand-soft); }
/* v0.4: スカウト・特別枠カード */
.cand p { margin: 6px 0; }
.cand.sel { outline: 3px solid var(--brand); outline-offset: -2px; }
.badge { display: inline-block; padding: 1px 9px; border-radius: 99px; background: #f2762e; color: #fff; font-size: 12px; font-weight: 700; }
/* v0.5: 立ち絵・カットイン・会話劇 */
.portrait { border-radius: 12px; overflow: hidden; line-height: 0; flex: none; background: var(--brand-soft); }
.portrait svg { width: 100%; height: 100%; display: block; }
.portrait.detail-p { width: 104px; height: 125px; }
.portrait.cand-p { width: 52px; height: 62px; border-radius: 9px; }
.portrait.cutin-p { width: 62px; height: 74px; border-radius: 9px; }
.portrait.dlg-p { width: 52px; height: 62px; border-radius: 9px; }
.pmini { width: 25px; height: 30px; display: inline-block; vertical-align: middle; margin-right: 5px; border-radius: 5px; overflow: hidden; line-height: 0; }
.pmini svg { width: 100%; height: 100%; display: block; }
.detail-head { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 6px; }
.cand-head { display: flex; gap: 10px; align-items: center; }
.cutin {
  display: flex; gap: 12px; align-items: center;
  background: var(--warn-soft); border: 1px solid var(--line); border-radius: 16px; padding: 8px 12px;
}
.cutin-line { font-weight: 700; margin-top: 2px; }
.dlg { display: flex; gap: 12px; align-items: center; }
/* v0.6: スカウティング欄 */
.scout { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; text-align: left; }
.scout .sec { margin-bottom: 4px; }
/* v0.7: 伸びしろバー */
.capmeter { margin: 2px 0 7px; height: 6px; }
/* v0.8: 交代パネル・編成画面 */
.subbox { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 8px; }
.sublist { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
.subbtn { text-align: left; font-size: 13px; padding: 7px 9px; margin-top: 6px; }
.sublist .subbtn { margin-top: 0; }
.subwarn { background: var(--warn-soft); border-radius: 8px; padding: 5px 8px; font-size: 13px; margin-top: 4px; }
.subrow { padding: 6px 2px; border-bottom: 1px solid var(--line); font-size: 13px; }

/* ===== 固定レイアウト（横画面・広い画面）: ページはスクロールしない ===== */
@media (min-width: 760px) and (orientation: landscape) {
  body { overflow: hidden; }
  #app {
    height: 100dvh; display: flex; flex-direction: column;
    padding: calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
  }
  .shell { display: flex; flex-direction: column; flex: 1; min-height: 0; gap: 10px; }
  .shell > * { margin-top: 0 !important; }
  .lay2 { display: grid; grid-template-columns: 1.05fr .95fr; gap: 12px; flex: 1; min-height: 0; }
  .col { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .col > * { margin-top: 0 !important; }
  .grow { flex: 1; min-height: 0; }
  .scroll { overflow-y: auto; }
  .banner.grow, .banner.fixed-h { min-height: 0; }
  .log { max-height: none; }
  .board { flex: 1; grid-template-rows: 1fr 1fr; height: 100%; }
  .cell { min-height: 0; }
  .form2 { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 14px; }
  table.squad th { position: sticky; top: -14px; background: var(--card); }
  .titlewrap { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 12px; max-width: 760px; width: 100%; margin: 0 auto; }
  .titlewrap .banner { height: 38dvh; }
  .titlewrap.titlephoto { max-width: none; justify-content: flex-end; min-height: 0; padding: 22px 26px; }
}
@media (orientation: portrait) and (max-width: 759px) {
  .portrait-note { display: block; text-align: center; color: var(--sub); font-size: 13px; padding: 6px; }
  .banner svg { height: auto; }
  #app { padding-top: calc(12px + env(safe-area-inset-top)); padding-left: calc(14px + env(safe-area-inset-left)); padding-right: calc(14px + env(safe-area-inset-right)); }
}

      h('p', null, ['卒業生が巣立ち、新しい世代がやってくる。中学3年生のスカウト候補から、声をかけたい選手を獲得リスト（' + quota + '名まで）に入れよう。']),
      h('div', { class: 'rowline' }, [h('span', { class: 'sub' }, ['部の格']), h('span', null, [gradeOf().n])]),
      h('div', { class: 'rowline' }, [h('span', { class: 'sub' }, ['スカウト獲得枠']), h('span', null, [quota + '名（選択中 ' + pickedN + '名）'])]),
      h('div', { class: 'rowline' }, [h('span', { class: 'sub' }, ['OB名鑑']), h('span', null, [G.obs.length + '名が記録に残る'])]),
      h('p', { class: 'sub' }, ['寸評はOBや中学の指導者からの伝聞。体格と「らしさ」のヒントにしよう。獲得できなくても、残りの枠は一般入部で埋まる。'])
    ];
    var newObs = G.obs.filter(function (o) { return o.year === G.year - 1; });
    if (newObs.length) {
      leftKids.push(h('div', { class: 'sec' }, ['巣立った卒業生']));
      newObs.slice(-5).forEach(function (o) {
        leftKids.push(h('div', { class: 'rowline' }, [h('span', null, [o.name]), h('span', { class: 'sub' }, [o.pos + '・総合 ' + o.avg])]));
      });
      leftKids.push(h('p', { class: 'sub' }, ['彼らの紹介や息子の入部で、OBはこれからも部に返ってくる。']));
    }
    var left = h('div', { class: 'card grow' }, leftKids);
    var list = h('div', { class: 'stack grow scroll' });
    if (R.special) {
      var sp = R.special;
      var sc = h('div', { class: 'card cand' + (sp.accepted ? ' sel' : '') });
      sc.appendChild(h('div', { class: 'sec' }, [sp.title]));
      sc.appendChild(candHead(sp.p));
      sc.appendChild(h('p', null, [sp.desc]));
      sc.appendChild(h('div', { class: 'hand' }, [
        h('button', { class: 'btn small' + (sp.accepted ? ' primary' : ''), onclick: function () { setSpecial(true); } }, ['迎え入れる']),
        h('button', { class: 'btn small', onclick: function () { setSpecial(false); } }, ['見送る'])
      ]));
      list.appendChild(sc);
    }
    R.cands.forEach(function (c, i) {
      var card = h('div', { class: 'card cand' + (c.picked ? ' sel' : '') });
      card.appendChild(candHead(c.p));
      if (c.elite) card.appendChild(h('div', null, [h('span', { class: 'badge' }, ['目玉候補'])]));
      card.appendChild(h('p', null, [c.blurb]));
      card.appendChild(h('div', { class: 'rowline' }, [
        h('span', { class: 'sub' }, ['獲得成功率の目安']),
        h('span', null, [Math.round(c.sp * 100) + '%'])
      ]));
      card.appendChild(h('button', { class: 'btn small' + (c.picked ? ' primary' : ''), onclick: (function (ix) { return function () { togglePick(ix); }; })(i) }, [c.picked ? '✔ 獲得リストから外す' : '獲得リストに入れる']));
      list.appendChild(card);
    });
    wrap([hud(), h('div', { class: 'lay2' }, [
      col([left]),
      col([list, h('button', { class: 'btn primary', onclick: function () { finishRecruit(); } }, ['新年度を始める'])])
    ])]);
  }
  function recordsScreen() {
    var c = h('div', { class: 'card grow scroll' });
    c.appendChild(h('div', { class: 'sec' }, ['監督の記録']));
    c.appendChild(h('div', { class: 'rowline' }, [h('span', null, ['在任']), h('span', null, [G.year + '年目'])]));
    c.appendChild(h('div', { class: 'rowline' }, [h('span', null, ['難易度']), h('span', null, [G.difficulty === 'challenge' ? 'チャレンジ' : 'ふつう'])]));
    c.appendChild(h('div', { class: 'rowline' }, [h('span', null, ['花園出場']), h('span', null, [G.career.hana + '回'])]));
    c.appendChild(h('div', { class: 'rowline' }, [h('span', null, ['花園での勝利']), h('span', null, [G.career.hanaWins + '勝'])]));
    c.appendChild(h('div', { class: 'rowline' }, [h('span', null, ['花園優勝']), h('span', null, [G.career.hanaTitles + '回'])]));
    if (G.rival) {
      c.appendChild(h('div', { class: 'rowline' }, [h('span', null, ['帝都学園との通算']), h('span', null, [G.rivalW + '勝 ' + G.rivalL + '敗'])]));
      c.appendChild(h('div', { class: 'rowline' }, [h('span', null, ['現在の帝都エース']), h('span', null, [G.rival.name + '（' + G.rival.grade + '年・' + G.rival.pos + '）'])]));
    }
    /* v0.9: 設備の解放状況 */
    c.appendChild(h('div', { class: 'sec' }, ['🏟 設備']));
    FACILITIES.forEach(function (f) {
      var has = hasFacility(f.k);
      c.appendChild(h('div', { class: 'rowline' }, [
        h('span', null, [(has ? '✓ ' : '🔒 ') + f.n]),
        h('span', { class: 'sub' }, [has ? '解放済み' : '部の格「' + GRADES[f.gi].n + '」で解放'])
      ]));
      c.appendChild(h('div', { class: 'sub' }, [f.d]));
    });
    /* v0.9: 歴代チーム（総合力ピークを「歴代最強」とする） */
    c.appendChild(h('div', { class: 'sec' }, ['📖 歴代チーム']));
    if (!G.history.length) c.appendChild(h('div', { class: 'sub' }, ['まだシーズンを終えていない']));
    var peak = G.history.reduce(function (a, hh) { return Math.max(a, hh.power); }, 0);
    G.history.slice().reverse().forEach(function (hh) {
      c.appendChild(h('div', { class: 'rowline' }, [
        h('span', null, [hh.year + '年目' + (hh.power === peak && peak > 0 ? ' 👑歴代最強' : '')]),
        h('span', { class: 'sub' }, ['総合力 ' + hh.power + '・' + hh.result])
      ]));
    });
    /* v0.9: 現役選手のキャリア通算トップ5 */
    c.appendChild(h('div', { class: 'sec' }, ['🏉 通算スタッツ（現役）']));
    var tops = G.players.slice().filter(function (p) { return p.crec && (p.crec.tries > 0 || p.crec.plays > 0); })
      .sort(function (a, b) { return (b.crec.tries * 3 + b.crec.plays) - (a.crec.tries * 3 + a.crec.plays); }).slice(0, 5);
    if (!tops.length) c.appendChild(h('div', { class: 'sub' }, ['まだ記録がない']));
    tops.forEach(function (p) {
      c.appendChild(h('div', { class: 'rowline' }, [
        h('span', null, [p.name]),
        h('span', { class: 'sub' }, [POSITIONS[p.posIdx].p + '・トライ ' + p.crec.tries + '／好プレー ' + p.crec.plays])
      ]));
    });
    var o = h('div', { class: 'card scroll', style: 'height:100%' });
    o.appendChild(h('div', { class: 'sec' }, ['OB名鑑（' + G.obs.length + '人）']));
    if (!G.obs.length) o.appendChild(h('div', { class: 'sub' }, ['まだ卒業生がいない']));
    G.obs.slice().reverse().forEach(function (x) {
      o.appendChild(h('div', { class: 'rowline' }, [h('span', null, [x.name]), h('span', { class: 'sub' }, [x.pos + '・' + x.year + '年卒・総合 ' + x.avg + ((x.tries || 0) > 0 ? '・トライ ' + x.tries : '') + ((x.plays || 0) > 0 ? '／好プレー ' + x.plays : '')])]));
    });
    wrap([hud(), h('div', { class: 'lay2' }, [col([c]), o]),
      h('button', { class: 'btn', onclick: function () { screen = G.recruit ? 'recruit' : (G.board ? 'board' : 'inst'); render(); } }, ['戻る'])
    ]);
  }

  /* ---------------- 起動 ---------------- */
  if (!loadSaved()) G = null;
  if (G) { sanitize(); save(); } /* マイグレーション結果を即永続化 */
  if (G && G.recruit) screen = 'recruit';
  else if (G && G.board) screen = 'board';
  else if (G && G.summary) screen = 'summary';
  else if (G && !G.goalSet && G.monthIdx === 0) screen = 'goal';
  else if (G) screen = 'inst';
  render();
})();

</script>
</body>
</html>
