<style>
/* Road to HANAZONO v0.2.1 — 横画面・固定レイアウト（ページをスクロールさせない） */
:root {
  --bg: #f4f7f2; --card: #ffffff; --ink: #1c241c; --sub: #5d6b5d; --line: #dde5da;
  --brand: #166534; --brand-ink: #ffffff; --brand-soft: #e5f2e7;
  --ok: #15803d; --ng: #c62f3b; --warn-soft: #fdf3d8; --shadow: 0 1px 3px rgba(20, 40, 20, .08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101410; --card: #1b211b; --ink: #e8eee8; --sub: #9fb09f; --line: #2c362c;
    --brand: #4ade80; --brand-ink: #0c1a0f; --brand-soft: #14301d;
    --ok: #4ade80; --ng: #ff8a8a; --warn-soft: #38300f; --shadow: 0 1px 3px rgba(0, 0, 0, .4);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { touch-action: manipulation; height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
  font-size: 16px; line-height: 1.5;
}
#app { max-width: 1060px; margin: 0 auto; padding: 12px 14px 40px; }
.stack > * + * { margin-top: 12px; }
.hud {
  display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center;
  background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px 14px; box-shadow: var(--shadow);
}
.hud .ttl { font-weight: 800; font-size: 17px; }
.hud .item b { font-variant-numeric: tabular-nums; }
.hud .sp { flex: 1; }
.hero { text-align: center; padding: 10px 6px 2px; }
.hero h1 { font-size: 23px; margin: 0 0 4px; }
.hero p { margin: 0; color: var(--sub); font-size: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; box-shadow: var(--shadow); }
.sec { font-weight: 700; margin: 2px 2px 8px; font-size: 15px; }
.rowline { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.big { font-size: 20px; font-weight: 800; }
.sub { color: var(--sub); font-size: 13px; }
.btn {
  display: block; width: 100%; padding: 13px; border: 1px solid var(--line); border-radius: 14px;
  background: var(--card); color: var(--ink); font-size: 16px; font-weight: 700; cursor: pointer;
  transition: transform .08s ease, background .15s ease;
}
.btn:active { transform: scale(.99); }
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: transparent; }
.btn.small { padding: 9px; font-size: 14px; }
.choices > * + * { margin-top: 8px; }
.choice { text-align: left; }
.choice .t { font-weight: 700; }
.choice .d { color: var(--sub); font-size: 13px; font-weight: 400; }
select {
  width: 100%; padding: 10px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--card); color: var(--ink); font-size: 15px;
}
label.lab { display: block; font-size: 13px; color: var(--sub); margin: 8px 0 3px; }
table.squad { width: 100%; border-collapse: collapse; font-size: 13px; }
table.squad th, table.squad td { padding: 5px 3px; border-bottom: 1px solid var(--line); text-align: center; font-variant-numeric: tabular-nums; }
table.squad th { color: var(--sub); font-weight: 600; font-size: 11px; }
table.squad td.name { text-align: left; font-weight: 700; white-space: nowrap; }
.score { display: flex; justify-content: space-between; align-items: center; text-align: center; }
.score .team { flex: 1; }
.score .pts { font-size: 32px; font-weight: 800; font-variant-numeric: tabular-nums; }
.score .vs { color: var(--sub); font-size: 13px; }
.log { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; font-size: 14px; overflow-y: auto; }
.log > * + * { margin-top: 6px; }
.log .hl { background: var(--warn-soft); border-radius: 8px; padding: 6px 8px; }
.log .score-line { font-weight: 700; }
.center { text-align: center; }
.banner { border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); border: 1px solid var(--line); line-height: 0; }
.banner svg { width: 100%; height: 100%; display: block; }
.portrait-note { display: none; }
/* すごろく盤面 */
.board { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.cell {
  border-radius: 12px; border: 1px solid var(--line); background: var(--card);
  min-height: 62px; padding: 6px 4px; text-align: center; font-size: 12px;
  display: flex; flex-direction: column; justify-content: center; gap: 2px;
}
.cell .ic { font-size: 19px; line-height: 1; }
.cell.done { opacity: .38; }
.cell.now { outline: 3px solid var(--brand); outline-offset: -1px; font-weight: 700; }
.cell.c-prac { background: #e9f7ec; } .cell.c-big { background: #cdeeda; }
.cell.c-ev { background: #fdeeda; } .cell.c-rec { background: #e3eefc; }
.cell.c-free { background: #f0f0ea; } .cell.c-meet { background: #f1e8fb; }
.cell.c-end { background: #fde8e8; }
@media (prefers-color-scheme: dark) {
  .cell.c-prac { background: #17301d; } .cell.c-big { background: #1d4530; }
  .cell.c-ev { background: #3a2c12; } .cell.c-rec { background: #16283f; }
  .cell.c-free { background: #24261f; } .cell.c-meet { background: #2a1f3d; }
  .cell.c-end { background: #3a1d1d; }
}
.hand { display: flex; gap: 8px; }
.pcard {
  flex: 1; padding: 10px 6px; border-radius: 14px; border: 1px solid var(--line);
  background: var(--brand-soft); color: var(--ink); cursor: pointer; text-align: center;
}
.pcard .num { font-size: 25px; font-weight: 800; color: var(--brand); display: block; line-height: 1.15; }
.pcard .cap { font-size: 12px; color: var(--sub); }
.pcard:active { transform: scale(.98); }
.meter { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.meter > div { height: 100%; background: var(--brand); }

/* ===== 固定レイアウト（横画面・広い画面）: ページはスクロールしない ===== */
@media (min-width: 760px) and (orientation: landscape) {
  body { overflow: hidden; }
  #app {
    height: 100dvh; display: flex; flex-direction: column;
    padding: calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
  }
  .shell { display: flex; flex-direction: column; flex: 1; min-height: 0; gap: 10px; }
  .shell > * { margin-top: 0 !important; }
  .lay2 { display: grid; grid-template-columns: 1.05fr .95fr; gap: 12px; flex: 1; min-height: 0; }
  .col { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .col > * { margin-top: 0 !important; }
  .grow { flex: 1; min-height: 0; }
  .scroll { overflow-y: auto; }
  .banner.grow, .banner.fixed-h { min-height: 0; }
  .log { max-height: none; }
  .board { flex: 1; grid-template-rows: 1fr 1fr; height: 100%; }
  .cell { min-height: 0; }
  .form2 { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 14px; }
  table.squad th { position: sticky; top: -14px; background: var(--card); }
  .titlewrap { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 12px; max-width: 760px; width: 100%; margin: 0 auto; }
  .titlewrap .banner { height: 38dvh; }
}
@media (orientation: portrait) and (max-width: 759px) {
  .portrait-note { display: block; text-align: center; color: var(--sub); font-size: 13px; padding: 6px; }
  .banner svg { height: auto; }
  #app { padding-top: calc(12px + env(safe-area-inset-top)); padding-left: calc(14px + env(safe-area-inset-left)); padding-right: calc(14px + env(safe-area-inset-right)); }
}

</style>
</head>

  /* ---------------- 状態 ---------------- */
  var G = null, M = null;

  function rnd(a, b) { return a + Math.random() * (b - a); }

  var namePool = {};

  function makePlayer(posIdx, year, base) {

  function overall(p) { return STATS.reduce(function (a, s) { return a + p.stats[s.k]; }, 0) / 6; }
  function newGame() {

  function starters() {

  function clutchBonus() { return starters().reduce(function (a, p) { return a + (p.trait.clutch || 0); }, 0) / 4; }
  function effOf(p) { return p.fatigue >= 70 ? 0.55 : (p.fatigue >= 40 ? 0.85 : 1); }
  function avgFatigue() { return Math.round(G.players.reduce(function (a, p) { return a + p.fatigue; }, 0) / Math.max(1, G.players.length)); }

  /* ---------------- 月頭指示と盤面 ---------------- */
  function unitOf(p) {

  function startMonth() {

/* ---------------- 試合(v0.1踏襲) ---------------- */
var TACTICS = [
{ k: 'fw', n: 'FW重視', d: 'モールの成功率アップ', key: 'maul'},

function oppPower(idx) { return OPPONENTS[idx].power + (idx >= 1? Math.min(8, (G.year - 1)): 0);}
function startMatch(oppIdx) {

M = {

}
function convProb() { return clamp(0.45 + (statAvg(starters(), 'kik') - 50) * 0.008, 0.2, 0.9);}
function tryScore(mine) {
var pts = 5, txt = 'トライ！';

else txt += ' コンバージョンは外れた（+5点）';
if (mine) M.my += pts; else M.op += pts;
return txt;
}
function pgScore(mine) { if (mine) M.my += 3; else M.op += 3; return 'ペナルティゴール成功（+3点）';}
function scoreRoll(diff) { return Math.random() < clamp(0.32 + diff * 0.012, 0.05, 0.75);}
function playBlock() {
var diff = teamPower() - M.power + M.bonus;
var minute = (M.block + 1) * 8;
if (scoreRoll(diff)) M.log.push('桜丘、攻め込む。' + tryScore(true));
else if (scoreRoll(-diff + 6)) M.log.push('相手の攻撃を止めきれない。' + tryScore(false));
else if (Math.random() < 0.3) M.log.push('桜丘のPG。' + pgScore(true));
else if (Math.random() < 0.22) M.log.push('相手のPG。' + pgScore(false));

render();
}
function maybeHighlightOrEnd() {

if (M.block === 2 || M.block === 5 || M.block === 8) { M.phase = 'highlight'; M.pending = makeHighlight();}
}
function hlProb(statVal) { return clamp(0.45 + (statVal - M.power) * 0.02 + M.bonus * 0.006, 0.1, 0.92);}

var st = starters();
var fwPow = statAvg(st, 'pow', 'FW'), bkGo = (statAvg(st, 'spd', 'BK') + statAvg(st, 'pas', 'BK')) / 2;
var kick = statAvg(st, 'kik'), tak = statAvg(st, 'tak'), sta = statAvg(st, 'sta');

{ n: '受けて立って粘る', d: 'スタミナが勝負', p: P('def', sta) - 0.05, win: '何度も止めて、最後は相手の反則を誘った！', lose: '粘りきれず押し込まれた…'},
{ n: '勝負タックル', d: 'ハイリスク・ハイリターン', p: P('def', tak) - 0.15, win: '起死回生のタックル！ ボールがこぼれた', lose: 'かわされて一気に持っていかれた…'}
]};
var behind = M.my <= M.op;
return { kind: behind? 'attack': 'defense', title: behind? '勝負どころ：終盤、敵陣でのチャンス！': '勝負どころ：終盤、リードを守れるか！', choices: behind? [

]};

function chooseHighlight(idx) {

function finishMatch() {

function afterMatchNext() {

var idx = M.oppIdx;

if (idx === 4) { G.season.result = won? '花園で勝利！': '花園出場（1回戦敗退）'; seasonEnd(); return;}
if (!won) {
G.season.result = idx === 1? '予選1回戦敗退': (idx === 2? '予選準決勝敗退': '予選決勝敗退');

/* ---------------- 年度末と世代交代 ---------------- */
function seasonEnd() {
var grads = G.players.filter(function (p) { return p.year === 3;});
G.summary = {

grade: gradeOf().n, grads: grads.map(function (p) { return { name: p.name, pos: POSITIONS[p.posIdx].p, avg: Math.round(overall(p))};}),
firstHana: G.qualified && G.career.hana === 1
};
screen = 'summary'; save(); render();
}
function nextYear() {
var grads = G.players.filter(function (p) { return p.year === 3;});
grads.forEach(function (p) {
G.obs.push({ name: p.name, pos: POSITIONS[p.posIdx].p, avg: Math.round(overall(p)), year: G.year});
});
if (G.obs.length > 40) G.obs = G.obs.slice(-40);
G.players = G.players.filter(function (p) { return p.year!== 3;});
G.players.forEach(function (p) { p.year++; p.injured = 0; p.fatigue = ri(5, 15);});
var gr = gradeOf();
for (var i = 0; i < gr.count; i++) {
var counts = [];
for (var n = 0; n < 15; n++) counts.push(G.players.filter(function (p) { return p.posIdx === n;}).length + rnd(0, 1.2));
var minIdx = 0;
counts.forEach(function (c, ix) { if (c < counts[minIdx]) minIdx = ix;});
G.players.push(makePlayer(minIdx, 1, gr.fresh));
}
sortRoster();
G.year++; G.monthIdx = 0; G.qualified = false; G.nextBonus = 0;
G.season = { wins: 0, losses: 0, result: '予選敗退'};
G.inst.focus = G.players[0]? G.players[0].id: 1;
G.summary = null;
screen = 'inst'; save(); render();
}

      ]));
    });
    wrap([hud(), h('div', { class: 'lay2' }, [
      col([banner('match', 'grow'), vs]),
      col([box, h('button', { class: 'btn primary', onclick: function () { startMatch(mo.match); } }, ['キックオフ'])])
    ])]);
  }
  function matchScreen() {
    var sb = h('div', { class: 'card score' }, [
      h('div', { class: 'team' }, [h('div', null, ['桜丘高校']), h('div', { class: 'pts' }, [String(M.my)])]),
      h('div', { class: 'vs' }, [M.done ? '試合終了' : Math.min(80, M.block * 8) + '分']),
      h('div', { class: 'team' }, [h('div', null, [M.opp.name]), h('div', { class: 'pts' }, [String(M.op)])])
    ]);
    var ctrl = h('div', { class: 'card grow scroll' });
    if (M.phase === 'highlight' && M.pending) {
      ctrl.appendChild(h('div', { class: 'sec' }, [M.pending.title]));
      var box = h('div', { class: 'choices' });
      M.pending.choices.forEach(function (c, i) {
        box.appendChild(h('button', { class: 'btn choice', onclick: function () { chooseHighlight(i); } }, [
          h('span', { class: 't' }, [c.n]), h('span', { class: 'd' }, [' — ' + c.d + '（成功率の目安 ' + Math.round(c.p * 100) + '%）'])
        ]));
      });
      ctrl.appendChild(box);
    } else if (!M.done) {
      ctrl.appendChild(h('div', { class: 'sec' }, ['実況']));
      ctrl.appendChild(h('p', { class: 'sub' }, ['左の実況を見ながら、試合を進めよう。勝負どころでは采配が求められる']));
      ctrl.appendChild(h('button', { class: 'btn primary', onclick: function () { playBlock(); } }, ['試合を進める']));
    } else {
      ctrl.appendChild(h('div', { class: 'sec' }, [M.result === 'win' ? '勝利！' : '試合終了']));
      ctrl.appendChild(h('button', { class: 'btn primary', onclick: function () { afterMatchNext(); } }, [M.result === 'win' ? 'やった！次へ' : '次へ']));
    }
    var log = h('div', { class: 'log grow' });
    M.log.forEach(function (ln) {
      log.appendChild(h('div', ln.indexOf('勝負どころ') >= 0 ? { class: 'hl' } : (ln.indexOf('トライ') >= 0 || ln.indexOf('勝利') >= 0 ? { class: 'score-line' } : null), [ln]));
    });
    wrap([sb, h('div', { class: 'lay2' }, [log, col([ctrl])])]);
    var lg = document.querySelector('.log'); if (lg) lg.scrollTop = lg.scrollHeight;
  }
  function summaryScreen() {
    var s = G.summary;
    var result = h('div', { class: 'card center' }, [
      h('div', { class: 'big' }, [G.year + '年目のシーズン終了']),
      h('p', null, [s.result + '（' + s.wins + '勝 ' + s.losses + '敗）']),
      s.firstHana ? h('p', null, ['🎉 創部以来、初の花園出場！']) : h('span', null, []),
      h('div', { class: 'rowline' }, [h('span', null, ['部の格']), h('span', { class: 'big' }, [s.grade])]),
      h('div', { class: 'rowline' }, [h('span', null, ['通算 花園出場']), h('span', null, [G.career.hana + '回'])])
    ]);
    var g = h('div', { class: 'card grow scroll' });
    g.appendChild(h('div', { class: 'sec' }, ['卒業する3年生（' + s.grads.length + '人）']));
    s.grads.forEach(function (x) { g.appendChild(h('div', { class: 'rowline' }, [h('span', null, [x.name]), h('span', { class: 'sub' }, [x.pos + '・総合 ' + x.avg])])); });
    g.appendChild(h('div', { class: 'sub' }, ['彼らはOBとして記録に残る。お疲れさま']));
    wrap([hud(), h('div', { class: 'lay2' }, [
      col([banner(G.qualified ? 'hanazono' : 'sunset', 'grow'), result]),
      col([g, h('button', { class: 'btn primary', onclick: function () { nextYear(); } }, ['新年度へ（新入生が入部する）'])])
    ])]);
  }
  function recordsScreen() {
    var c = h('div', { class: 'card' });
    c.appendChild(h('div', { class: 'sec' }, ['監督の記録']));
    c.appendChild(h('div', { class: 'rowline' }, [h('span', null, ['在任']), h('span', null, [G.year + '年目'])]));
    c.appendChild(h('div', { class: 'rowline' }, [h('span', null, ['花園出場']), h('span', null, [G.career.hana + '回'])]));
    c.appendChild(h('div', { class: 'rowline' }, [h('span', null, ['花園での勝利']), h('span', null, [G.career.hanaWins + '勝'])]));
    var o = h('div', { class: 'card scroll', style: 'height:100%' });
    o.appendChild(h('div', { class: 'sec' }, ['OB名鑑（' + G.obs.length + '人）']));
    if (!G.obs.length) o.appendChild(h('div', { class: 'sub' }, ['まだ卒業生がいない']));
    G.obs.slice().reverse().forEach(function (x) {
      o.appendChild(h('div', { class: 'rowline' }, [h('span', null, [x.name]), h('span', { class: 'sub' }, [x.pos + '・' + x.year + '年卒・総合 ' + x.avg])]));
    });
    wrap([hud(), h('div', { class: 'lay2' }, [col([c]), o]),
      h('button', { class: 'btn', onclick: function () { screen = G.board ? 'board' : 'inst'; render(); } }, ['戻る'])
    ]);
  }

  /* ---------------- 起動 ---------------- */
  if (!loadSaved()) G = null;
  if (G && G.board) screen = 'board';
  else if (G && G.summary) screen = 'summary';
  else if (G) screen = 'inst';
  render();
})();

</script>
</body>
</html>
